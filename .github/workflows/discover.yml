name: Discover companies

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: discover-companies
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Discover + harvest
        run: |
          python run.py discover
          python run.py harvest

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/companies.json
          if git diff --staged --quiet; then
            echo "No new companies."
          else
            git commit -m "chore: discover new companies ($(date -u +'%Y-%m-%d')) [skip ci]"
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "push contention, retrying ($attempt)..."; sleep 5
            done
          fi
